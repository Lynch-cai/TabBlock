<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TabBlock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/logo.png" alt="" width="28" height="28">
    <span class="brand">TabBlock</span>
    <a class="donate" href="https://ko-fi.com/lynch_" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z" fill="currentColor"/></svg>
      <span data-i18n="donate">Soutenir</span>
    </a>
    <a class="source" href="https://github.com/Lynch-cai/TabBlock" target="_blank" rel="noopener" aria-label="Code source sur GitHub" data-i18n-aria="source">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>

  <main id="home" class="main">
    <p id="host" class="host"></p>
    <div id="counters" class="counters">
      <p class="blocked"><span data-i18n="blocked">Bloqués : </span><span id="tab-count">0</span></p>
      <p class="total"><span data-i18n="totalBlocked">Total bloqué : </span><span id="total-count">0</span></p>
    </div>

    <label class="switch">
      <input id="toggle" type="checkbox" role="switch">
      <span class="track" aria-hidden="true">
        <span class="knob">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </span>
      <span class="sr-only" data-i18n="protectSite">Protection sur ce site</span>
    </label>

    <p id="status" class="status" aria-live="polite"></p>
    <button id="grant" class="grant" type="button" hidden data-i18n="grant">Autoriser TabBlock sur ce site</button>
  </main>

  <button id="footer" class="footer" type="button"></button>

  <section id="sites-view" class="sites" hidden>
    <div class="sites-head">
      <button id="back" class="back" type="button" aria-label="Retour" data-i18n-aria="back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 data-i18n="protectedSites">Sites protégés</h2>
    </div>
    <ul id="site-list" class="site-list"></ul>
    <p id="sites-empty" class="sites-empty" hidden data-i18n="sitesEmpty">Aucun site protégé pour l'instant. Activez l'interrupteur sur un site pour l'ajouter ici.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
